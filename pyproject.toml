[project]
name = "txt2pid"
version = "0.1.2"
description = "Extract identifiers from text."
authors = [{ name = "datadave", email = "605409+datadavev@users.noreply.github.com" }]
requires-python = "~=3.9"
readme = "README.md"
license = "AGPLv3"
dependencies = ["click>=8.1.7,<9"]

[dependency-groups]
dev = ["pytest>=8.1.1,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry_bumpversion.file."txt2pid/__init__.py"]
